name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: cut-iq-ci
          MARIADB_DATABASE: cutiq
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://root:cut-iq-ci@127.0.0.1:3306/cutiq
      APP_ID: cut-iq-studio-ci
      APP_SECRET: cut-iq-studio-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Initialize test schema
        run: mysql --host=127.0.0.1 --port=3306 --user=root --password=cut-iq-ci cutiq < installer/schema.sql
      - run: npm test
      - run: npm run check
      - run: npm run lint
      - run: npm run build
