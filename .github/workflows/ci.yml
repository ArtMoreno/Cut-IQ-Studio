name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-app:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run check
      - run: npm run lint
      - run: npm run build

  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No database service: the app uses a local SQLite file created by its own
    # migrations, so this job needs nothing but a temp directory.
    env:
      APP_ID: cut-iq-studio-ci
      APP_SECRET: cut-iq-studio-ci-only
      # runner.* is not available in job-level env, only inside steps.
      CUTIQ_DATABASE_FILE: ${{ github.workspace }}/cut-iq-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Initialize test schema
        run: npx drizzle-kit migrate
      - run: npx vitest run server/script/pipeline.test.ts
